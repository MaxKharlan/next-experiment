[project]
name = "next-experiment"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "boto3>=1.43.114",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "openai>=3.31.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.4",
    "sse-starlette>=3.5.0",
    "tenacity>=9.2.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "moto[s3]>=5.2.4",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
eval = [
    "cleanlab>=2.9.0",
    "peft>=0.21.2",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
]
ml = [
    "datasets>=5.1.0",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "transformers>=5.19.0",
]
